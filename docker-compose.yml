services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: greengap
      POSTGRES_USER: myseo
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./api/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myseo -d greengap"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DB_HOST: db
      DB_NAME: greengap
      DB_USER: myseo
      DB_PORT: 5432
      DATA_DIR: /data
      OUTPUT_DIR: /output
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
      - ./output:/output:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
